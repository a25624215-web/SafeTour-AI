<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Safe-Yatra AI — Authority Sentinel Login</title>
  <meta name="description" content="Safe-Yatra AI Authority Sentinel Login - Secure access portal for travel safety command center.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="authority.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      position: relative;
      background: var(--bg-primary);
      overflow: hidden;
    }
    
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-card);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-accent);
      border-radius: var(--radius-xl);
      padding: 40px 32px;
      box-shadow: var(--shadow-lg), var(--shadow-glow-cyan);
      z-index: 10;
      position: relative;
    }

    .auth-backlight {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.08) 0%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
      z-index: 1;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .auth-logo-area {
      text-align: center;
      margin-bottom: 32px;
    }

    .auth-logo-circle {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--accent-gold), var(--accent-emerald));
      padding: 1.5px;
      margin: 0 auto 16px;
    }

    .auth-logo-inner {
      width: 100%;
      height: 100%;
      background: #0a150f;
      border-radius: calc(var(--radius-md) - 1.5px);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-gold);
    }

    .auth-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-white);
      margin-bottom: 4px;
    }

    .auth-subtitle {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .auth-form-group {
      margin-bottom: 20px;
    }

    .auth-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-primary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
    }

    .auth-input-wrapper {
      position: relative;
    }

    .auth-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      background: #09150e;
      border: 1px solid rgba(223, 177, 91, 0.25);
      color: var(--text-white);
      font-size: 0.85rem;
      transition: border-color 0.25s var(--ease-out);
    }

    .auth-input:focus {
      outline: none;
      border-color: var(--accent-gold);
      box-shadow: 0 0 10px rgba(223, 177, 91, 0.1);
    }

    .auth-submit-btn {
      width: 100%;
      padding: 14px;
      border-radius: var(--radius-md);
      background: linear-gradient(90deg, #173825, #245237, var(--accent-gold));
      color: var(--text-white);
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      box-shadow: 0 0 25px rgba(223, 177, 91, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.25s var(--ease-out);
    }

    .auth-submit-btn:hover {
      box-shadow: 0 0 35px rgba(223, 177, 91, 0.6);
      transform: translateY(-1px);
    }

    .auth-submit-btn:active {
      transform: translateY(0);
      scale: 0.98;
    }

    .auth-footer-link {
      text-align: center;
      margin-top: 24px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .auth-footer-link a {
      color: var(--accent-gold);
      font-weight: 600;
      text-decoration: none;
    }

    .auth-footer-link a:hover {
      text-decoration: underline;
    }

    .auth-demo-hint {
      margin-top: 24px;
      padding: 12px;
      background: rgba(223, 177, 91, 0.04);
      border: 1px dashed rgba(223, 177, 91, 0.25);
      border-radius: var(--radius-sm);
      font-size: 0.7rem;
      color: var(--text-secondary);
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body class="authority-body">

  <div class="auth-container">
    <div class="auth-backlight"></div>

    <div class="auth-card">
      <div class="auth-logo-area">
        <div class="auth-logo-circle">
          <div class="auth-logo-inner">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
            </svg>
          </div>
        </div>
        <h2 class="auth-title">Authority Sentinel Login</h2>
        <p class="auth-subtitle">Access Command Center Telemetry</p>
      </div>

      <form id="auth-form" class="space-y-4">
        <div class="auth-form-group">
          <label class="auth-label" for="email">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <span>Email Address</span>
          </label>
          <div class="auth-input-wrapper">
            <input
              type="email"
              id="email"
              placeholder="authority@safeyatra.gov.in"
              required
              class="auth-input"
              value="admin@safeyatra.gov.in"
            />
          </div>
        </div>

        <div class="auth-form-group">
          <label class="auth-label" for="password">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <span>Password</span>
          </label>
          <div class="auth-input-wrapper">
            <input
              type="password"
              id="password"
              placeholder="••••••••"
              required
              class="auth-input"
              value="admin123"
            />
          </div>
        </div>

        <button type="submit" class="auth-submit-btn">
          <span>Access Command Center</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </form>

      <div class="auth-demo-hint">
        <strong>Demo Credentials:</strong><br>
        Email: <code>admin@safeyatra.gov.in</code><br>
        Password: <code>admin123</code>
      </div>

      <div class="auth-footer-link">
        Are you a traveler? <a href="/SafeTour-AI/login">Tourist Login</a>
      </div>
    </div>
  </div>

  <!-- TOAST CONTAINER -->
  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <script src="authority.js"></script>
  <script>
    // Handle login verification client-side
    document.getElementById('auth-form').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      // Simple credentials check
      if (email === 'admin@safeyatra.gov.in' && password === 'admin123') {
        showToast('Login successful! Accessing secure gateway...', 'success');
        
        // Save auth state in sessionStorage for dashboard context
        sessionStorage.setItem('safeyatra_auth_role', 'authority');
        sessionStorage.setItem('safeyatra_auth_email', email);
        
        setTimeout(function() {
          window.location.href = 'authority-dashboard.html';
        }, 1500);
      } else {
        showToast('Invalid credentials. Please use the demo credentials.', 'error');
      }
    });

    // Mirroring toast system from authority.js
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const icons = { success: '✓', error: '✕', info: 'ℹ', warning: '⚠' };
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      toast.innerHTML = `
        <span class="toast-icon">${icons[type] || 'ℹ'}</span>
        <span class="toast-message">${message}</span>
        <button class="toast-close" aria-label="Close notification">&times;</button>
      `;

      container.appendChild(toast);

      const closeBtn = toast.querySelector('.toast-close');
      closeBtn.addEventListener('click', () => {
        toast.classList.add('removing');
        setTimeout(() => toast.remove(), 300);
      });

      setTimeout(() => {
        if (!toast.classList.contains('removing')) {
          toast.classList.add('removing');
          setTimeout(() => toast.remove(), 300);
        }
      }, 4500);
    }
  </script>
</body>
</html>
